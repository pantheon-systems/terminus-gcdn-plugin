name: Test

on:
  pull_request:
  push:
    branches: [main, next]
    tags: ['*']

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHP ${{ matrix.php }} / Terminus ${{ matrix.terminus }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
        # Oldest supported 3.x (getSiteById() needs 3.2), latest 3.x,
        # first 4.x, latest 4.x. Keep in sync with extra.terminus.compatible-version.
        terminus: ['3.2.0', '^3', '4.0.0', '^4']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies (Terminus ${{ matrix.terminus }})
        env:
          TERMINUS_VERSION: ${{ matrix.terminus }}
        run: |
          composer require --dev --no-update "pantheon-systems/terminus:${TERMINUS_VERSION}"
          composer update --no-interaction --no-progress
          composer show pantheon-systems/terminus | grep '^versions'

      - name: Lint
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: PHPUnit
        run: vendor/bin/phpunit

  version:
    # G1: gcdn:update compares releases against UpdatePluginCommand::VERSION,
    # so a tag must match it.
    name: Tag matches VERSION
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Compare
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n "s/.*const VERSION = '\(.*\)';/\1/p" src/Commands/UpdatePluginCommand.php)
          echo "tag=${TAG} VERSION=${version}"
          if [ "${TAG#v}" != "${version}" ]; then
            echo "::error::Tag ${TAG} does not match UpdatePluginCommand::VERSION (${version}). Bump VERSION before tagging."
            exit 1
          fi
